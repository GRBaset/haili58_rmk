[keyboard]
name = "haili58"
product_name = "haili58"
vendor_id = 0x4c4b
product_id = 0x4643
manufacturer = "RMK"
chip = "nrf52840"

[layout]
rows = 10
cols = 6
map = """
[2.0] (0,2) (0,3) [5.25] (5,3) (5,2)
[y=-0.75]
(0,0) (0,1) [2.0] (0,4) [3.25] (5,4) [2.0] (5,1) (5,0)
[y=-0.75]
[5.0] (0,5) [1.25] (5,5)
[y=-0.5]
[2.0] (1,2) (1,3) [5.25] (6,3) (6,2)
[y=-0.75]
(1,0) (1,1) [2.0] (1,4) [3.25] (6,4) [2.0] (6,1) (6,0)
[y=-0.75]
[5.0] (1,5) [1.25] (6,5)
[y=-0.5]
[2.0] (2,2) (2,3) [5.25] (7,3) (7,2)
[y=-0.75]
(2,0) (2,1) [2.0] (2,4) [3.25] (7,4) [2.0] (7,1) (7,0)
[y=-0.75]
[5.0] (2,5) [1.25] (7,5)
[y=-0.5]
[2.0] (3,2) (3,3) [5.25] (8,3) (8,2)
[y=-0.75]
(3,0) (3,1) [2.0] (3,4) [3.25] (8,4) [2.0] (8,1) (8,0)
[y=-0.75]
[5.0] (3,5) [1.25] (8,5)
[y=0.25]
[2.75] (4,3) (4,4) [0.25] (4,5) [1.25] (9,5) [0.25] (9,4) (9,3)
"""

[keymap]
layers = 5

[ble]
enabled = true

[split]
connection = "ble"

[split.central]
rows = 5
cols = 6
row_offset = 0
col_offset = 0

[split.central.matrix]
matrix_type = "normal"
row_pins = ["P0_11", "P1_04", "P1_06", "P0_09", "P0_10"]
col_pins = ["P0_31", "P0_29", "P0_02", "P1_15", "P1_13", "P1_11"]
bootmagic = [0, 0]
# RMK uses col2row as the default matrix diode direction, if you want to use a row2col matrix, add `row2col = true`
# row2col = true

[[split.peripheral]]
rows = 5
cols = 6
row_offset = 0
col_offset = 5

[split.peripheral.matrix]
matrix_type = "normal"
row_pins = ["P0_11", "P1_04", "P1_06", "P0_09", "P0_10"]
col_pins = ["P1_11", "P1_13", "P1_15", "P0_02", "P0_29", "P0_31"]
bootmagic = [0, 0]
# RMK uses col2row as the default matrix diode direction, if you want to use a row2col matrix, add `row2col = true`
# row2col = true

# [[split.peripheral]]
# rows = 2
# cols = 1
# row_offset = 2
# col_offset = 2
# serial = [{ instance = "UART0", tx_pin = "PIN_0", rx_pin = "PIN_1" }]
# row_pins = ["PIN_9", "PIN_11"]
# col_pins = ["PIN_10"]

[rmk]
split_peripherals_num = 1